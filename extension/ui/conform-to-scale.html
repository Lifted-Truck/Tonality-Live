<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --p-live-ui-bg: hsl(0, 0%, 21%);
        --p-live-input-bg: hsl(0, 0%, 12%);
        --p-live-text-primary: hsl(0, 0%, 71%);
        --p-live-text-secondary: hsl(0, 0%, 41%);
        --p-live-control-border: hsl(0, 0%, 7%);
        --p-live-accent-primary: hsl(31, 100%, 67%);
        --p-live-control-text--enabled: hsl(0, 0%, 7%);
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--p-live-ui-bg);
        color: var(--p-live-text-primary);
        font: 12px/1.5 -apple-system, "Segoe UI", sans-serif;
      }
      h1 { font-size: 13px; margin: 0 0 12px; }
      label { display: block; margin-bottom: 6px; color: var(--p-live-text-secondary); }
      select {
        width: 100%;
        box-sizing: border-box;
        background: var(--p-live-input-bg);
        color: var(--p-live-text-primary);
        border: 1px solid var(--p-live-control-border);
        border-radius: 3px;
        padding: 6px 8px;
        font-size: 13px;
      }
      .field { margin-bottom: 10px; }
      .degrees {
        color: var(--p-live-text-secondary);
        font: 11px/1.4 ui-monospace, Menlo, monospace;
        margin: 4px 0 0;
        min-height: 15px;
      }
      .row { display: flex; gap: 8px; margin-top: 14px; }
      button {
        flex: 1;
        border: none;
        border-radius: 3px;
        padding: 6px 12px;
        font-weight: 600;
        cursor: pointer;
      }
      #ok { background: var(--p-live-accent-primary); color: var(--p-live-control-text--enabled); }
      #cancel { background: var(--p-live-input-bg); color: var(--p-live-text-primary); }
    </style>
  </head>
  <body>
    <h1>Conform clip to scale</h1>
    <div class="field">
      <label for="root">Root</label>
      <select id="root" autofocus>
        <option value="0">C</option><option value="1">C#/Db</option>
        <option value="2">D</option><option value="3">D#/Eb</option>
        <option value="4">E</option><option value="5">F</option>
        <option value="6">F#/Gb</option><option value="7">G</option>
        <option value="8">G#/Ab</option><option value="9">A</option>
        <option value="10">A#/Bb</option><option value="11">B</option>
      </select>
    </div>
    <div class="field">
      <label for="scale">Scale</label>
      <select id="scale"></select>
      <p class="degrees" id="degrees"></p>
    </div>
    <div class="field">
      <label for="tie">Ties resolve</label>
      <select id="tie">
        <option value="previous">Toward the previous note (default)</option>
        <option value="down">Always down</option>
        <option value="up">Always up</option>
      </select>
    </div>
    <div class="row">
      <button id="cancel">Cancel</button>
      <button id="ok">Apply</button>
    </div>
    <script>
      // Injected by the extension from the engine's catalog (GET /scales), so
      // this list never drifts from what the engine will accept.
      const SCALES = __TONALITY_SCALES__;
      const PC = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

      const scaleSel = document.getElementById("scale");
      for (const s of SCALES) {
        const opt = document.createElement("option");
        opt.value = s.name;
        opt.textContent = s.name;
        if (s.name === "Ionian") opt.selected = true;
        scaleSel.appendChild(opt);
      }

      function showDegrees() {
        const root = parseInt(document.getElementById("root").value, 10);
        const found = SCALES.find((s) => s.name === scaleSel.value);
        document.getElementById("degrees").textContent = found
          ? found.degrees.map((d) => PC[(root + d) % 12]).join("  ")
          : "";
      }
      scaleSel.addEventListener("change", showDegrees);
      document.getElementById("root").addEventListener("change", showDegrees);
      showDegrees();

      const wk = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.live;
      const wv = window.chrome && window.chrome.webview;
      function send(result) {
        const msg = { method: "close_and_send", params: [JSON.stringify(result)] };
        if (wk) wk.postMessage(msg);
        else if (wv) wv.postMessage(msg);
      }
      function apply() {
        send({
          rootPc: parseInt(document.getElementById("root").value, 10),
          scale: scaleSel.value,
          tieBreak: document.getElementById("tie").value,
        });
      }
      document.getElementById("ok").addEventListener("click", apply);
      document.getElementById("cancel").addEventListener("click", () => send({ rootPc: null }));
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") apply();
        if (e.key === "Escape") send({ rootPc: null });
      });
    </script>
  </body>
</html>
